baseURL = "/"
theme = "hugo-apero"
languageCode = "en"
title = "Adrien Allorant"
author = "Adrien Allorant"
copyright = ""
googleAnalytics = ""
metaDataFormat = "yaml"
footnoteReturnLinkContents = "&#8617;"
preserveTaxonomyNames = true
ignoreLogs = ['warning-goldmark-raw-html']
ignoreFiles = ["\\.Rmd$", "\\.Rmarkdown$", "_cache$", "\\.knit\\.md$", "\\.utf8\\.md$"]
enableEmoji = true

[pagination]
  pagerSize = 10

[markup]
  defaultMarkdownHandler = "goldmark"
  [markup.goldmark.renderer]
    unsafe = true
    hardwraps = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.highlight]
    style = "github"

[params]
  orgName = "Adrien Allorant"
  orgLocal = "Southampton, UK"
  description = "Lecturer in social statistics and global health at the University of Southampton and Deputy Director of S3RI. Bayesian, spatial, and survey methods for measuring health and inequality."
  favicon = "/img/favicon.ico"
  logo = ""
  mainSections = ["publications"]
  navallcaps = false
  socialInHeader = false
  socialInFooter = true
  sharing_image = "/img/profile.jpeg"

  # custom palette — file at assets/warm-hex.scss
  theme = ""
  custom_theme = "warm-hex"

  # built-in apéro fonts (woff2 bundled in theme)
  customtextFontFamily = "Commissioner"
  customheadingFontFamily = "Fraunces"
  textFontFamily = "sans-serif"
  headingFontFamily = "serif"

  comments = ""

  [params.math]
    renderer = "katex"

  [[params.social]]
    icon      = "envelope"
    icon_pack = "fas"
    url       = "mailto:adrien.allorant@soton.ac.uk"
  [[params.social]]
    icon      = "github"
    icon_pack = "fab"
    url       = "https://github.com/aallorant"
  [[params.social]]
    icon      = "google-scholar"
    icon_pack = "ai"
    url       = "https://scholar.google.com/citations?user=s1UVCmwAAAAJ&hl=fr"
  [[params.social]]
    icon      = "orcid"
    icon_pack = "ai"
    url       = "https://orcid.org/0000-0002-9663-7561"
  [[params.social]]
    icon      = "linkedin"
    icon_pack = "fab"
    url       = "https://www.linkedin.com/in/adrien-allorant-4b2b4881/"

[taxonomies]
  category = "categories"
  series = "series"
  tag = "tags"

